media:
  input: Plumber
  output: /Plumber

content:
  - name: config
    label: Website Configuration
    type: file
    path: Plumber/config.json
    format: json
    fields:
      - name: business
        type: object
        fields:
          - name: name
            type: string
          - name: shortName
            type: string
          - name: tagline
            type: string
          - name: phone
            type: string
          - name: phoneLink
            type: string
          - name: email
            type: string
          - name: address
            type: string
          - name: foundedYear
            type: number

      - name: theme
        type: object
        fields:
          - name: primary
            type: string
          - name: primaryDark
            type: string
          - name: primaryLight
            type: string
          - name: accent
            type: string
          - name: accentLight
            type: string
          - name: cyan
            type: string

      - name: hero
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: headline
            type: string
          - name: subheadline
            type: string
          - name: ctaPrimary
            type: string
          - name: ctaSecondary
            type: string
          - name: statusLabel
            type: string
          - name: statusValue
            type: string

      - name: stats
        type: list
        fields:
          - name: value
            type: number
          - name: prefix
            type: string
          - name: suffix
            type: string
          - name: label
            type: string
          - name: gaugePercent
            type: number

      - name: services
        type: list
        fields:
          - name: icon
            type: string
          - name: title
            type: string
          - name: description
            type: string

      - name: about
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: headline
            type: string
          - name: text
            type: string
          - name: image
            type: string

      - name: serviceAreas
        type: list
        field:
          type: string

      - name: gallery
        type: list
        fields:
          - name: image
            type: string
          - name: caption
            type: string
          - name: location
            type: string

      - name: testimonials
        type: list
        fields:
          - name: name
            type: string
          - name: location
            type: string
          - name: rating
            type: number
          - name: text
            type: string

      - name: faq
        type: list
        fields:
          - name: question
            type: string
          - name: answer
            type: string

      - name: hours
        type: list
        fields:
          - name: day
            type: string
          - name: time
            type: string

      - name: emergencyNote
        type: string

      - name: socials
        type: object
        fields:
          - name: facebook
            type: string
          - name: instagram
            type: string
          - name: google
            type: string

      - name: seo
        type: object
        fields:
          - name: title
            type: string
          - name: description
            type: string
