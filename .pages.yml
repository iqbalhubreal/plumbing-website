media:
  input: Plumber
  output: /Plumber

content:
  - name: config
    label: Website Configuration
    type: file
    path: Plumber/config.json
    format: json
    fields:
      - name: business
        type: object
        fields:
          - name: name
            type: string
          - name: shortName
            type: string
          - name: tagline
            type: string
          - name: phone
            type: string
          - name: phoneLink
            type: string
          - name: email
            type: string
          - name: address
            type: string
          - name: foundedYear
            type: number

      - name: theme
        type: object
        fields:
          - name: primary
            type: string
          - name: primaryDark
            type: string
          - name: primaryLight
            type: string
          - name: accent
            type: string
          - name: accentLight
            type: string
          - name: cyan
            type: string

      - name: hero
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: headline
            type: string
          - name: subheadline
            type: string
          - name: ctaPrimary
            type: string
          - name: ctaSecondary
            type: string
          - name: statusLabel
            type: string
          - name: statusValue
            type: string

      - name: seo
        type: object
        fields:
          - name: title
            type: string
          - name: description
            type: string
