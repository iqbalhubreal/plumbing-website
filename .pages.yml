media:
  input: Plumber/images
  output: /Plumber/images
  categories: [image]
  extensions: [jpg, jpeg, png, webp]
  rename: safe

content:
  - name: config
    label: Website Configuration
    type: file
    path: Plumber/config.json
    format: json
    fields:
      - name: business
        label: Business
        type: object
        fields:
          - name: name
            label: Business name
            type: string
          - name: shortName
            label: Short name
            type: string
          - name: tagline
            label: Tagline
            type: string
          - name: phone
            label: Phone
            type: string
          - name: phoneLink
            label: Phone link
            type: string
          - name: email
            label: Email
            type: string
          - name: address
            label: Address
            type: string
          - name: foundedYear
            label: Founded year
            type: number
            options:
              min: 1800
              max: 2100

      - name: theme
        label: Theme Colors
        type: object
        fields:
          - name: primary
            type: string
          - name: primaryDark
            type: string
          - name: primaryLight
            type: string
          - name: accent
            type: string
          - name: accentLight
            type: string
          - name: cyan
            type: string

      - name: hero
        label: Hero
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: headline
            type: text
          - name: subheadline
            type: text
          - name: ctaPrimary
            label: Primary CTA text
            type: string
          - name: ctaSecondary
            label: Secondary CTA text
            type: string
          - name: statusLabel
            type: string
          - name: statusValue
            type: string

      - name: stats
        label: Stats
        type: object
        list:
          collapsible: true
        fields:
          - name: value
            type: number
          - name: prefix
            type: string
          - name: suffix
            type: string
          - name: label
            type: string
          - name: gaugePercent
            label: Gauge percent
            type: number
            options:
              min: 0
              max: 100

      - name: services
        label: Services
        type: object
        list:
          collapsible: true
        fields:
          - name: icon
            type: select
            options:
              values: [droplet, thermometer, wrench, pipe, clock, shield, home, filter]
          - name: title
            type: string
          - name: description
            type: text

      - name: about
        label: About
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: headline
            type: string
          - name: text
            type: text
          - name: features
            type: string
            list: true
          - name: image
            type: image
            options:
              extensions: [jpg, jpeg, png, webp]
              rename: safe

      - name: serviceAreas
        label: Service Areas
        type: string
        list: true

      - name: gallery
        label: Project Gallery
        type: object
        list:
          collapsible: true
        fields:
          - name: image
            type: image
            options:
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: caption
            type: string
          - name: location
            type: string

      - name: testimonials
        label: Testimonials
        type: object
        list:
          collapsible: true
        fields:
          - name: name
            type: string
          - name: location
            type: string
          - name: rating
            type: number
            options:
              min: 1
              max: 5
          - name: text
            type: text

      - name: faq
        label: FAQ
        type: object
        list:
          collapsible: true
        fields:
          - name: question
            type: string
          - name: answer
            type: text

      - name: hours
        label: Business Hours
        type: object
        list:
          collapsible: true
        fields:
          - name: day
            type: string
          - name: time
            type: string

      - name: emergencyNote
        label: Emergency Note
        type: string

      - name: socials
        label: Social Links
        type: object
        fields:
          - name: facebook
            type: string
          - name: instagram
            type: string
          - name: google
            type: string

      - name: seo
        label: SEO
        type: object
        fields:
          - name: title
            type: string
          - name: description
            type: text
          - name: keywords
            type: string
            list: true
